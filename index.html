<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Happy Valentine’s Day 💌</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: radial-gradient(circle at top, #1a0530 0, #05010a 55%, #000 100%);
      color: #fdf2ff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .card {
      width: 90%;
      max-width: 650px;
      background: rgba(10, 5, 25, 0.9);
      border-radius: 28px;
      padding: 32px;
      border: 1px solid rgba(255, 154, 194, 0.35);
      box-shadow:
        0 0 40px rgba(255, 75, 139, 0.35),
        0 0 120px rgba(132, 94, 247, 0.35);
      backdrop-filter: blur(18px);
      text-align: left;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(255, 75, 139, 0.12);
      border: 1px solid rgba(255, 154, 194, 0.5);
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #ff9ac2;
    }

    .tag-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #fff, #ff4b8b);
      box-shadow: 0 0 10px rgba(255, 75, 139, 0.9);
    }

    h1 {
      margin-top: 20px;
      font-size: 2.6rem;
      line-height: 1.1;
    }

    .gradient {
      background: linear-gradient(120deg, #ff4b8b, #ffd166);
      -webkit-background-clip: text;
      color: transparent;
    }

    .subtitle {
      margin-top: 14px;
      font-size: 1rem;
      line-height: 1.6;
      color: rgba(250, 230, 255, 0.85);
    }

    .signature {
      margin-top: 20px;
      font-size: 1rem;
      font-style: italic;
      color: rgba(255, 209, 255, 0.9);
    }

    .signature span {
      font-weight: 600;
      color: #ff9ac2;
      font-style: normal;
    }

    /* HEART */

      margin-top: 30px;
      display: flex;
      justify-content: center;
