<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Happy Valentine’s Day 💌</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg: #05010a;
      --pink: #ff4b8b;
      --pink-soft: #ff9ac2;
      --accent: #ffd166;
      --card-bg: rgba(10, 5, 25, 0.9);
      --text: #fdf2ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text",
        "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #1a0530 0, #05010a 55%, #000 100%);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .scene {
      position: relative;
      width: 100%;
      max-width: 900px;
      padding: 40px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .glow-orbit {
      position: absolute;
      inset: -40%;
      background:
        radial-gradient(circle at 10% 10%, rgba(255, 75, 139, 0.25), transparent 55%),
        radial-gradient(circle at 90% 20%, rgba(255, 209, 102, 0.18), transparent 55%),
        radial-gradient(circle at 20% 90%, rgba(132, 94, 247, 0.25), transparent 55%);
      filter: blur(4px);
      opacity: 0.9;
      pointer-events: none;
      animation: orbitGlow 18s linear infinite alternate;
    }

    @keyframes orbitGlow {
      0% { transform: translate3d(0, 0, 0) scale(1); }
      50% { transform: translate3d(10px, -20px, 0) scale(1.05); }
      100% { transform: translate3d(-10px, 10px, 0) scale(1.02); }
    }

    .card {
      position: relative;
      width: 100%;
      max-width: 640px;
      padding: 32px 28px 30px;
      border-radius: 28px;
      background: linear-gradient(135deg, rgba(10, 5, 25, 0.96), rgba(10, 5, 25, 0.9));
      border: 1px solid rgba(255, 154, 194, 0.35);
      box-shadow:
        0 0 40px rgba(255, 75, 139, 0.35),
        0 0 120px rgba(132, 94, 247, 0.35);
      backdrop-filter: blur(18px);
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
      gap: 24px;
      overflow: hidden;
    }

    @media (max-width: 720px) {
      .card {
        grid-template-columns: 1fr;
        padding: 26px 22px 24px;
      }
    }

    .card-left {
      position: relative;
      padding-right: 6px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      z-index: 1;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(255, 75, 139, 0.12);
      border: 1px solid rgba(255, 154, 194, 0.5);
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--pink-soft);
    }

    .tag-dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: radial-gradient(circle at 30% 30%, #fff, var(--pink));
      box-shadow: 0 0 10px rgba(255, 75, 139, 0.9);
    }

    h1 {
      font-size: clamp(2.2rem, 3vw + 1rem, 3.1rem);
      line-height: 1.05;
      letter-spacing: -0.04em;
    }

    h1 span.gradient {
      background: linear-gradient(120deg, var(--pink), var(--accent));
      -webkit-background-clip: text;
      color: transparent;
      text-shadow: 0 0 24px rgba(255, 75, 139, 0.6);
    }

    .subtitle {
      font-size: 0.95rem;
      line-height
